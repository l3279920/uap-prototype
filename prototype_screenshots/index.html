<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Index — Prototype captures</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,sans-serif;color:#18221f;background:#eeece5}*{box-sizing:border-box}body{margin:0}header{background:#17211e;color:#f7f3e8;padding:34px clamp(18px,5vw,72px)}header a{color:#dbbb7b}h1{font:48px Georgia,serif;margin:12px 0}header p{max-width:780px;color:#abb9b4;line-height:1.5}.wrap{max-width:1500px;margin:auto;padding:30px clamp(12px,4vw,60px) 70px}.stage{border-top:1px solid #c8c5ba;padding:25px 0}.stage h2{font:25px Georgia,serif}.pair{display:grid;grid-template-columns:minmax(0,2fr) minmax(230px,.65fr);gap:18px;align-items:start}figure{margin:0;background:#faf9f5;border:1px solid #cbc8bd;padding:9px}img{width:100%;height:auto;display:block;background:#ddd}figcaption{font-size:11px;color:#65716d;padding:9px 2px 2px}a{color:#23584c}@media(max-width:700px){h1{font-size:37px}.pair{grid-template-columns:1fr}.pair figure:nth-child(2){max-width:390px}.wrap{padding-bottom:40px}}
</style></head><body><header><a href="../prototype/">← Back to playable prototype</a><h1>Investigation flow captures</h1><p>Paired desktop and mobile viewport captures, generated by sequential Playwright interactions with each decisive region deliberately scrolled into view. No application state was injected directly.</p></header><main class="wrap" id="gallery"></main><script>
const stages=[
['Aguadilla 01 — Enter the case','01_aguadilla_case_open'],['Aguadilla 02 — Inspect official record','02_aguadilla_official_record'],['Aguadilla 03 — Build source context','03_aguadilla_sources_viewed'],['Aguadilla 04 — Expose weather coverage gap','04_aguadilla_weather_gap'],['Aguadilla 05 — Compare platform motion','05_aguadilla_platform_motion'],['Aguadilla 06 — Map disputed claims','06_aguadilla_disputed_claims'],['Aguadilla 07 — Save record comparison','07_aguadilla_comparison'],['Aguadilla 08 — Save bounded conclusion','08_aguadilla_conclusion'],
['PR159 01 — Incoming record','09_pr159_intake'],['PR159 02 — Inspect exact metadata','10_pr159_metadata'],['PR159 03 — Synchronized version seek','11_pr159_sync_compare'],['PR159 04 — Review relationship mechanics','12_pr159_relationship_options'],['PR159 05 — Author relationship reason','13_pr159_reason_authored'],['PR159 06 — File archive relationship','14_pr159_archive_result'],['PR159 07 — Reopen preserved Tremonton case','15_tremonton_reopened']];
document.querySelector('#gallery').innerHTML=stages.map(([title,file])=>`<section class="stage"><h2>${title}</h2><div class="pair"><figure><a href="desktop_${file}.png"><img loading="lazy" src="desktop_${file}.png" alt="Desktop: ${title}"></a><figcaption>Desktop · 1440 × 900 viewport capture</figcaption></figure><figure><a href="mobile_${file}.png"><img loading="lazy" src="mobile_${file}.png" alt="Mobile: ${title}"></a><figcaption>Mobile · 390 × 844 viewport capture</figcaption></figure></div></section>`).join('');
</script></body></html>
